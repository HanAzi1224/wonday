version: '3.6'
services:
  aurumworks-dev-api:
    image: 506876573492.dkr.ecr.ap-northeast-2.amazonaws.com/aurumworks-api-dev:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '1'
    depends_on:
      - redis
    environment:
      - VIRTUAL_HOST=aurumworks-api-dev.team-everywhere.com
      - VIRTUAL_PORT=4001
      - LETSENCRYPT_HOST=aurumworks-api-dev.team-everywhere.com
      - LETSENCRYPT_EMAIL=developer@team-everywhere.com
      - TZ=Asia/Seoul
      - NODE_ENV=development
      - AWS_DEFAULT_REGION=ap-northeast-2
    networks:
      - nginx-proxy
      - redis-connect
    links:
      - redis:redis
    labels:
      - autoheal=true

